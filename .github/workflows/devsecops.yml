name: DevSecOps Pipeline

# Compuertas de seguridad (Quality Gates) para el ciclo de vida de software seguro.
# Un hallazgo bloqueante en cualquier compuerta deja el pipeline en rojo e impide
# aprobar el build. Solo el codigo remediado pasa a verde.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Escaneo de secretos (bloqueante)
        run: gitleaks detect --config .gitleaks.toml --source . --no-git --redact --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.90.0
    steps:
      - uses: actions/checkout@v4
      - name: Gate - reglas OWASP del proyecto (bloqueante)
        run: semgrep --config .semgrep/reglas-tf.yml --error --verbose .
      - name: Informe - OWASP Top 10 y Node/JS (no bloqueante)
        run: |
          semgrep --config p/owasp-top-ten --config p/javascript \
            --sarif --output semgrep.sarif . || true
      - name: Publicar SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.55.0
    steps:
      - uses: actions/checkout@v4
      - name: SCA - dependencias (bloqueo por HIGH/CRITICAL corregibles)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 package-lock.json
